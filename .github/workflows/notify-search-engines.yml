name: Notify Search Engines

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/webmasters'

      - name: Resubmit sitemap to Google Search Console
        run: |
          curl -f -sS -X PUT \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            "https://searchconsole.googleapis.com/webmasters/v3/sites/$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ secrets.SITE_URL }}', safe=''))")/sitemaps/$(python3 -c "import urllib.parse; print(urllib.parse.quote('${{ secrets.SITEMAP_URL }}', safe=''))")"

      - name: Ping IndexNow
        run: |
          curl -f -sS -X POST "https://api.indexnow.org/indexnow" \
          -H "Content-Type: application/json" \
          -d "{
                \"host\": \"www.backendengineer.in\",
                \"key\": \"${{ secrets.INDEXNOW_KEY }}\",
                \"keyLocation\": \"https://www.backendengineer.in/${{ secrets.INDEXNOW_KEY }}.txt\",
                \"urlList\": [\"https://www.backendengineer.in/sitemap.xml\"]
              }"